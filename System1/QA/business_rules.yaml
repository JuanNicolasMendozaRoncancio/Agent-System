# Business rules for the QA Agent.
#
# Structure
# ---------
# non_negative_variables:
#   Variables that must always have value >= 0 (physically impossible otherwise).
#   Violations are always CRITICAL.
#
# completeness:
#   min_ratio_critical : completeness below this → CRITICAL
#   min_ratio_medium   : completeness below this → MEDIUM
#   min_ratio_low      : completeness below this → LOW
#   (completeness >= min_ratio_low is acceptable — no anomaly flagged)
#
# drift:
#   severity: severity assigned when drift_detected=True from the Profiling Agent.
#   The QA Agent reads drift results from the profile — it does NOT recompute them.
#
# missing_variables:
#   severity: severity assigned when the Profiling Agent reports missing expected variables.

non_negative_variables:
  - generation_solar
  - generation_wind_onshore
  - generation_wind_offshore
  - generation_nuclear
  - generation_hydro_run_of_river
  - generation_hydro_water_reservoir
  - generation_hydro_pumped_storage
  - generation_biomass
  - generation_geothermal
  - generation_other_renewable
  - climate_solar_radiation
 
completeness:
  min_ratio_critical: 0.50   # < 50%  → CRITICAL
  min_ratio_medium:   0.80   # < 80%  → MEDIUM
  min_ratio_low:      0.95   # < 95%  → LOW
                             # >= 95% → no anomaly
 
drift:
  severity: MEDIUM
 
missing_variables:
  severity: MEDIUM